services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in server/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vart_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in server/.env}
      DATABASE_URL: postgresql://postgres:${PGPASSWORD}@db:5432/vart_db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://localhost:5001/api/auth/google/callback
      PROMPTPAY_ID: ${PROMPTPAY_ID:-}
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5001
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
